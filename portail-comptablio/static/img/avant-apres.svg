<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Avant Comptablio : comptable débordé par la paperasse. Avec Comptablio : comptable serein et organisé.">
  <defs>
    <linearGradient id="calmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10204f"/>
      <stop offset="100%" stop-color="#081332"/>
    </linearGradient>
  </defs>

  <!-- ── Carte gauche : sans Comptablio ───────────────────────────── -->
  <g>
    <rect x="24" y="24" width="336" height="372" rx="24" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="192" y="60" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="17" fill="#18181b">Sans Comptablio</text>

    <!-- horloge en retard -->
    <circle cx="322" cy="70" r="20" fill="#ffffff" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="322" y1="70" x2="322" y2="58" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="322" y1="70" x2="331" y2="76" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>

    <!-- papiers éparpillés -->
    <g stroke="#d4d4d8" stroke-width="1.5">
      <rect x="70" y="150" width="66" height="86" rx="6" fill="#ffffff" transform="rotate(-14 103 193)"/>
      <rect x="238" y="158" width="66" height="86" rx="6" fill="#ffffff" transform="rotate(11 271 201)"/>
      <rect x="150" y="130" width="66" height="86" rx="6" fill="#ffffff" transform="rotate(-3 183 173)"/>
    </g>
    <g stroke="#e4e4e7" stroke-width="3" stroke-linecap="round">
      <line x1="88" y1="175" x2="120" y2="169" transform="rotate(-14 103 193)"/>
      <line x1="88" y1="189" x2="120" y2="183" transform="rotate(-14 103 193)"/>
      <line x1="88" y1="203" x2="112" y2="199" transform="rotate(-14 103 193)"/>
      <line x1="256" y1="183" x2="288" y2="177" transform="rotate(11 271 201)"/>
      <line x1="256" y1="197" x2="288" y2="191" transform="rotate(11 271 201)"/>
      <line x1="167" y1="155" x2="199" y2="149" transform="rotate(-3 183 173)"/>
      <line x1="167" y1="169" x2="199" y2="163" transform="rotate(-3 183 173)"/>
      <line x1="167" y1="183" x2="191" y2="179" transform="rotate(-3 183 173)"/>
    </g>

    <!-- éclats de stress -->
    <g stroke="#ef4444" stroke-width="4" stroke-linecap="round">
      <path d="M148 118 L156 100 L164 112 L172 96" fill="none"/>
    </g>
    <circle cx="234" cy="112" r="15" fill="#ef4444"/>
    <text x="234" y="118" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="18" fill="#ffffff">!</text>

    <!-- silhouette débordée -->
    <ellipse cx="192" cy="300" rx="80" ry="14" fill="#fecaca" opacity="0.5"/>
    <rect x="147" y="236" width="90" height="104" rx="30" fill="#9ca3af"/>
    <circle cx="192" cy="196" r="34" fill="#d4d4d8"/>
    <circle cx="181" cy="192" r="3.2" fill="#3f3f46"/>
    <circle cx="203" cy="192" r="3.2" fill="#3f3f46"/>
    <path d="M180 210 Q192 202 204 210" stroke="#3f3f46" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- mains sur la tête -->
    <path d="M158 238 Q140 210 162 188" stroke="#9ca3af" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M226 238 Q244 210 222 188" stroke="#9ca3af" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ── Flèche centrale ───────────────────────────────────────────── -->
  <g>
    <circle cx="400" cy="210" r="30" fill="url(#calmGrad)"/>
    <path d="M389 210 L411 210 M401 199 L412 210 L401 221" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ── Carte droite : avec Comptablio ───────────────────────────── -->
  <g>
    <rect x="440" y="24" width="336" height="372" rx="24" fill="#eef4ff" stroke="#cfd8ea" stroke-width="1.5"/>
    <text x="608" y="60" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="17" fill="#18181b">Avec Comptablio</text>

    <!-- écran / tableau de bord -->
    <rect x="536" y="90" width="144" height="94" rx="10" fill="#ffffff" stroke="#b8c4e0" stroke-width="1.5"/>
    <rect x="596" y="184" width="24" height="10" fill="#b8c4e0"/>
    <rect x="580" y="194" width="56" height="6" rx="3" fill="#cfd8ea"/>
    <text x="608" y="112" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="800" font-size="11" fill="#10204f">Comptablio</text>
    <g font-family="Manrope, sans-serif" font-size="9" fill="#52525b">
      <circle cx="552" cy="130" r="6" fill="#16a34a"/>
      <path d="M549 130 L551.5 132.5 L556 127" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="564" y="127" width="90" height="6" rx="3" fill="#e2e8f5"/>

      <circle cx="552" cy="150" r="6" fill="#16a34a"/>
      <path d="M549 150 L551.5 152.5 L556 147" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="564" y="147" width="90" height="6" rx="3" fill="#e2e8f5"/>

      <circle cx="552" cy="170" r="6" fill="#16a34a"/>
      <path d="M549 170 L551.5 172.5 L556 167" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="564" y="167" width="70" height="6" rx="3" fill="#e2e8f5"/>
    </g>

    <!-- étincelles de sérénité -->
    <g fill="#f2b705">
      <path d="M500 76 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/>
      <circle cx="686" cy="88" r="4"/>
      <circle cx="668" cy="70" r="3"/>
    </g>

    <!-- silhouette sereine -->
    <ellipse cx="608" cy="388" rx="80" ry="14" fill="#cfd8ea" opacity="0.5"/>
    <rect x="563" y="298" width="90" height="86" rx="26" fill="#10204f"/>
    <circle cx="608" cy="266" r="30" fill="#cfd8ea"/>
    <circle cx="598" cy="262" r="3" fill="#3f3f46"/>
    <circle cx="618" cy="262" r="3" fill="#3f3f46"/>
    <path d="M598 276 Q608 285 618 276" stroke="#3f3f46" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- bras détendus -->
    <path d="M578 306 Q564 330 576 356" stroke="#10204f" stroke-width="16" fill="none" stroke-linecap="round"/>
    <path d="M638 306 Q652 330 640 356" stroke="#10204f" stroke-width="16" fill="none" stroke-linecap="round"/>
  </g>
</svg>
